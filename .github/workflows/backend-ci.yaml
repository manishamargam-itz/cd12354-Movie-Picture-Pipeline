name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "starter/backend/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: starter/backend

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv
      - name: Install Dependencies
        run: pipenv install --dev
      - name: Run Flake8
        run: pipenv run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv
      - name: Install Dependencies
        run: pipenv install --dev
      - name: Run Test Suite
        run: pipenv run test

  build:
    name: Build Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: starter/backend
          push: false
          tags: backend:ci

  notify:
    name: Report CI Failure
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Add failure notice
        run: |
          echo "::error::Backend CI failed. Review the failed job logs."
          {
            echo "## Backend CI failed"
            echo "One or more lint, test, or build jobs failed."
          } >> "$GITHUB_STEP_SUMMARY"