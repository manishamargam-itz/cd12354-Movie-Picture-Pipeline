name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'cluster' }}
  ECR_REPOSITORY: frontend

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true

  build:
    name: Build and Push Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crucial if using temporary session tokens
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: starter/frontend
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }}

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crucial if using temporary session tokens
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Apply frontend manifests
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image frontend=${{ needs.build.outputs.image }}
          kustomize build . | kubectl apply -f -
          if ! kubectl rollout status deployment/frontend --timeout=300s; then
            echo "::error::Frontend rollout failed. Collecting diagnostics..."
            kubectl get pods -l app=frontend -o wide || true
            kubectl describe deployment frontend || true
            kubectl describe pods -l app=frontend || true
            kubectl logs -l app=frontend --all-containers --tail=200 || true
            exit 1
          fi
      - name: Verify Kubernetes deployment
        if: always()
        run: |
          kubectl rollout status deployment/frontend --timeout=180s || true
          echo "----- Logging - kubectl get all ---- "
          kubectl get all
          echo "----- Logging - kubectl describe deploy ----- "
          kubectl describe deploy frontend
      - name: Verify Frontend ECR image
        if: always()
        run: |
          echo "----- Logging - Frontend ECR Image Details ----- "
          AWS_PAGER="" aws ecr describe-images --repository-name frontend --region us-east-1 --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' --output table

  notify:
    name: Report Deployment Failure
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [lint, test, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Frontend CD failed. Review the failed job logs."
          echo "## Frontend CD failed" >> "$GITHUB_STEP_SUMMARY"
